services:
  heimdallr:
    build: .
    image: heimdallr:latest
    container_name: heimdallr
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "853:853/tcp"
      - "853:853/udp"
      - "5380:5380/tcp"
    volumes:
      - heimdallr-data:/var/lib/heimdallr
      - ./config/heimdallr.toml:/etc/heimdallr/heimdallr.toml:ro
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
volumes:
  heimdallr-data:
