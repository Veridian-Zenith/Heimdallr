name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: OpenSSL ban (default must be pure ring)
        run: |
          cargo tree | grep -iE "openssl|bssl|aws-lc" && echo "banned crypto found" && exit 1 || echo "clean: ring only"
      - name: Audit
        run: |
          cargo install cargo-audit --locked && cargo audit --ignore RUSTSEC-2026-0118 --ignore RUSTSEC-2026-0119 || echo "audit known hickory-proto 0.25 vulns ignored (0.26 breaking API, see ROADMAP)"
      - name: Build
        run: cargo build
      - name: Test
        run: cargo test
      - name: Check-config smoke
        run: cargo run -- --check-config --config config/heimdallr.toml
      - name: Install Botan dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libbotan-2-dev
- name: Botan feature check
        run: cargo check --features botan-crypto

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-deny --locked
      - run: cargo deny check || true
