name: Release

on:
  push:
    tags:
      - '*.*.*'
      - '*.*.*a'
      - '*.*.*b'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  release:
    name: Build & Release
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust stable
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libbotan-3-dev || sudo apt-get install -y pkg-config libbotan-2-dev botan

      - name: Build
        run: cargo build --release

      - name: Upload binary (Linux) artifact
        uses: actions/upload-artifact@v4
        with:
          name: heimdallr-linux
          path: target/release/heimdallr

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Heimdallr ${{ github.ref_name }}"
          body: |
            ## Heimdallr ${{ github.ref_name }}

            A from-zero Rust DNS server (OSL-3.0), privacy & security focused.

            ### Binaries
            - Linux: `heimdallr-linux`

          draft: false
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') }}
