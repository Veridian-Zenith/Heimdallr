version: 2
updates:
  # Enable GitHub Actions Dependabot
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Allow dependencies to be version updates, not just minor patches
    open-pull-requests-limit: 10
    # Review alerts as they come in
    commit-message:
      prefix: "deps"

  # Enable Dependabot for repository dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    dependency-type: "runtime"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Allow version updates for all dependency types
    allow:
      - dependency-type: "runtime"
      - dependency-type: "security"

  # Security updates for dependencies
  - package-ecosystem: "github.com"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Allow all dependency updates (not just security)
    allow:
      - dependency-type: "*"
    # Automatically merge PRs with no conflicts and passing CI
    # (this requires Dependabot security updates to be enabled)
    # reviewers:
    #   - "team-ml"
    #   - "golang-authorized"

  # Security updates
  - package-ecosystem: "github.com"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Only allow security updates
    allow:
      - dependency-type: "security"
    # Review alerts as they come in
    commit-message:
      prefix: "security"
