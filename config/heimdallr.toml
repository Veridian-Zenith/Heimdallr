listen = ["127.0.0.1:5354"]
listen_tls = []
listen_quic = []
listen_https = []

[resolver]
# Isolated test — do NOT forward to 127.0.0.1:53 (Technitium live). Use Quad9 9.9.9.11 only (host-reachable, verified dig @9.9.9.11 ok, while 1.1.1.1/8.8.8.8 blocked).
forwarders = ["9.9.9.11:53"]
forward_protocol = "udp"
qname_minimization = true
qname_randomization = false
ecs = false
concurrency = 2
timeout_ms = 2000

[cache]
size = 50000
serve_stale = true
prefetch = 2

[dnssec]
validation = true
signing = false
provider = "ring"

[filter]
blocklists = []
allowlists = []
regex_blocklist = []
cname_cloaking = true
rebinding = true

[proxy]
enable = false
allow = []
protocol = "v2"

[api]
listen = "127.0.0.1:5381"

[auth]
totp = true
oidc = false

[log]
level = "info"
format = "json"

[dhcp]
enable = false

[cluster]
enable = false

[[zones]]
name = "example.test."
kind = "primary"
file = "/var/lib/heimdallr/zones/example.test.zone"
