# Heimdallr Config (v0.6.5-alpha — simplified with M6.1-M6.5 features)
# This file is managed by the web UI (M7) or edited manually (advanced).

# Basic listen addresses
listen = ["127.0.0.1:5354"]
listen_tls = []
listen_quic = []
listen_https = []

host = "localhost"
# hostadmin = "admin@localhost"

zones_dir = "/etc/heimdallr/zones"

# TLS (auto-detect Let's Encrypt by default)
# [tls]
# cert = "/etc/letsencrypt/live/<host>/fullchain.pem"
# key = "/etc/letsencrypt/live/<host>/privkey.pem"

[resolver]
forwarders = ["9.9.9.11:53"]
forward_protocol = "udp"
# M5.4 — QNAME minimization (RFC 9156, opt-in, strict default)
# qname_minimization = { enable = false, mode = "strict", max_iterations = 7 }
qname_randomization = false
ecs = false
concurrency = 2
timeout_ms = 2000
# M5.6 — DNS64 prefix for AAAA synthesis (RFC 6052 / 6147)
dns64_prefix = "64:ff9b::/96"

[cache]
size = 50000
serve_stale = true
prefetch = 2
# M6.3 — persistent binary (JSON) cache file
persistent = "/var/lib/heimdallr/cache.bin"
persistent_max_age_days = 7

[dnssec]
validation = true
signing = false
provider = "ring"

[filter]
# M6.1 — blocklists (hosts / AdGuard meta-list URLs or file paths)
blocklists = []
# M6.1 — allowlists (override blocklist matches)
allowlists = []
# M6.2 — regex blocklist patterns
regex_blocklist = [".*\\.doubleclick\\.net$"]
# M6.1 — per-client ACL (CIDR format)
# per_client = { "10.0.0.0/24" = { block = false } }
cname_cloaking = true
rebinding = true
# M6.1 — sinkhole IPs for blocked queries
sinkhole_v4 = "0.0.0.0"
sinkhole_v6 = "::"
# M6.1 — blocklist refresh interval (hours; 0 = manual only)
refresh_interval_h = 24

[proxy]
enable = false
allow = []
protocol = "v2"

[api]
listen = "127.0.0.1:5381"

[auth]
totp = false
oidc = false

[log]
level = "info"
format = "json"
# M6.4 — PostgreSQL-backed query log (table: dns_logs; DB: dnsquerylogs; user: postgres; instance: localhost:5432 / /var/lib/postgres/data)
query_log = "/var/lib/heimdallr/query_log.jsonl"
postgres_url = "postgresql://postgres@localhost:5432/dnsquerylogs"
# M6.5 — Prometheus metrics endpoint (top-level [metrics] block; default endpoint=/metrics, format=openmetrics)
# metrics = { enable = true, endpoint = "/metrics", format = "openmetrics" }

[dns64]
prefix = "64:ff9b::/96"
always_synthesize = false

[dhcp]
enable = false

[cluster]
enable = false

[[zones]]
name = "example.test."
kind = "primary"
file = "example.test.zone"

[[zones]]
name = "10.in-addr.arpa."
kind = "primary"
file = "10.in-addr.arpa.zone"
