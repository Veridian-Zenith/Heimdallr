[package]
name = "heimdallr"
version = "0.4.0-alpha"
edition = "2024"
license = "OSL-3.0"
authors = ["Veridian Zenith"]
repository = "https://github.com/Veridian-Zenith/Heimdallr"
description = "Heimdallr - privacy & security DNS server (authoritative + recursive, DoT/DoH/DoQ, DNSSEC) - Rust from-zero recreation, OSL-3.0"
readme = "README.md"

[features]
default = ["botan-crypto"]
botan-crypto = ["dep:botan"]

[dependencies]
tokio = { version = "1", features = ["full"] }
hickory-proto = { version = "0.26.1", features = ["dnssec-ring"] }
hickory-resolver = { version = "0.26.1", features = ["tokio", "dnssec-ring", "tls-ring", "https-ring", "quic-ring"] }
hickory-server = { version = "0.26.1", features = ["dnssec-ring", "resolver", "testing", "tls-ring", "https-ring", "quic-ring"] }
hickory-net = "0.26.1"
quinn = { version = "0.11", features = ["ring"], default-features = false }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
hex = "0.4"
ring = "0.17"
rcgen = { version = "0.14", features = ["ring"] }
# Botan crypto backend — required for DoT/DoH/DoQ TLS, future HSM/DNSSEC agility
botan = { version = "0.14", optional = true }
futures = "0.3"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1.4"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum = { version = "0.8", features = ["json"] }
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
tower = "0.5"
async-trait = "0.1"

[dev-dependencies]
criterion = { version = "0.8", features = ["async_tokio"] }
tempfile = "3"

[[bench]]
name = "cache_bench"
harness = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
