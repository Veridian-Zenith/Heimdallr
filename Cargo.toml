[package]
name = "heimdallr"
version = "0.1.0"
edition = "2024"
license = "OSL-3.0"
authors = ["Veridian Zenith"]
repository = "https://github.com/Veridian-Zenith/Heimdallr"
description = "Heimdallr - privacy & security DNS server (authoritative + recursive, DoT/DoH/DoQ, DNSSEC) - Rust from-zero recreation, OSL-3.0"
readme = "README.md"

[features]
default = []
botan-crypto = ["dep:botan"]

[dependencies]
tokio = { version = "1", features = ["full"] }
hickory-proto = { version = "0.25", features = ["dnssec-ring"] }
hickory-resolver = "0.25"
hickory-server = "0.25"
quinn = { version = "0.11", features = ["ring"], default-features = false }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
# Pure-Rust crypto via ring (no OpenSSL/BoringSSL/aws-lc). Botan optional for future custom DNSSEC/HSM.
botan = { version = "0.14", optional = true }
futures = "0.3"
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1.4"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.8", features = ["json"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
